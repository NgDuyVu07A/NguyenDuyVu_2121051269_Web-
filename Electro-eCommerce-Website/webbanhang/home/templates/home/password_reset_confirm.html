{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Đặt lại mật khẩu</title>
    <link type="text/css" rel="stylesheet" href="{% static 'home/css/bootstrap.min.css' %}" />
    <link type="text/css" rel="stylesheet" href="{% static 'home/css/style.css' %}" />
    <style>
        .login-box { width: 100%; max-width: 400px; margin: 80px auto; padding: 30px; border: 1px solid #e4e7ed; background-color: #fff; }
        .login-btn { background-color: #D10024; color: #fff; border: none; width: 100%; height: 40px; font-weight: 700; text-transform: uppercase; }
        .errorlist { color: red; font-size: 12px; list-style: none; padding: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h3 class="text-center">MẬT KHẨU MỚI</h3>
            {% if validlink %}
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="login-btn">Lưu mật khẩu</button>
                </form>
            {% else %}
                <p class="text-center" style="color: red;">Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</p>
                <a href="{% url 'password_reset' %}" class="btn btn-default btn-block">Yêu cầu liên kết mới</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
