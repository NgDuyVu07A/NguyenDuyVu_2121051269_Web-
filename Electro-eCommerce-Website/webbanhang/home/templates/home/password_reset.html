{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Quên mật khẩu</title>
    <link type="text/css" rel="stylesheet" href="{% static 'home/css/bootstrap.min.css' %}" />
    <link type="text/css" rel="stylesheet" href="{% static 'home/css/style.css' %}" />
    <style>
        .login-box {
            width: 100%;
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            border: 1px solid #e4e7ed;
            background-color: #fff;
        }

        .login-btn {
            background-color: #D10024;
            color: #fff;
            border: none;
            width: 100%;
            height: 40px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="login-box">
            <h3 class="text-center">QUÊN MẬT KHẨU</h3>
            <p class="text-center" style="font-size: 13px; margin-bottom: 20px;">Vui lòng nhập email tài khoản của bạn để nhận liên kết đặt lại mật khẩu.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Email của bạn</label>
                    <input type="email" name="email" class="form-control" required>

                    {% if form.email.errors %}
                    <div style="color: red; font-size: 13px; margin-top: 5px; font-weight: 500;">
                        {{ form.email.errors.0 }}
                    </div>
                    {% endif %}
                </div>
                <button type="submit" class="login-btn">Gửi yêu cầu</button>
            </form>
        </div>
    </div>
</body>

</html>
