{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Thanh toán</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="{% static 'home/css/bootstrap.min.css' %}" />
    <link type="text/css" rel="stylesheet" href="{% static 'home/css/style.css' %}" />
</head>
<body>
    <header><div id="header"><div class="container"><div class="col-md-3"><a href="/" class="logo"><img src="{% static 'home/img/logo.png' %}"></a></div></div></div></header>

    <div class="section">
        <div class="container">
            <form method="POST">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-7">
                        <div class="billing-details">
                            <div class="section-title"><h3 class="title">Địa chỉ nhận hàng</h3></div>
                            <div class="form-group"><input class="input" type="text" name="address" placeholder="Địa chỉ" required></div>
                            <div class="form-group"><input class="input" type="text" name="city" placeholder="Thành phố" required></div>
                            <div class="form-group"><input class="input" type="tel" name="tel" placeholder="Số điện thoại" required></div>
                        </div>
                    </div>

                    <div class="col-md-5 order-details">
                        <div class="section-title text-center"><h3 class="title">Đơn hàng của bạn</h3></div>
                        <div class="order-summary">
                            <div class="order-col"><div><strong>SẢN PHẨM</strong></div><div><strong>TỔNG</strong></div></div>
                            <div class="order-products">
                                {% for item in items %}
                                <div class="order-col">
                                    <div>{{ item.quantity }}x {{ item.product.name }}</div>
                                    <div>{{ item.get_total }} VNĐ</div>
                                </div>
                                {% endfor %}
                            </div>
                            <div class="order-col">
                                <div><strong>TỔNG CỘNG</strong></div>
                                <div><strong class="order-total" style="color: #D10024;">{{ order.get_cart_total }} VNĐ</strong></div>
                            </div>
                        </div>
                        <button type="submit" class="primary-btn order-submit" style="width: 100%;">ĐẶT HÀNG NGAY</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
