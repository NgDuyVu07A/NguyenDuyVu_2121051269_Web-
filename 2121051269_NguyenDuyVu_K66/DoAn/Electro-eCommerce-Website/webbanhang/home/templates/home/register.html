{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Đăng ký tài khoản</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="{% static 'home/css/bootstrap.min.css' %}" />
    <link type="text/css" rel="stylesheet" href="{% static 'home/css/style.css' %}" />
    <style>
        .register-box {
            width: 100%;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #e4e7ed;
            background-color: #fff;
        }
        .form-group { margin-bottom: 15px; }
        .form-group input { 
            width: 100%; height: 40px; padding: 0 15px; border: 1px solid #e4e7ed; 
        }
        .register-btn {
            background-color: #D10024; color: #fff; border: none; 
            width: 100%; height: 40px; font-weight: 700; text-transform: uppercase;
        }
        .register-btn:hover { background-color: #a8001d; }
        label { font-weight: 500; margin-bottom: 5px; display: block; }
        .helptext { font-size: 12px; color: #888; display: block; margin-top: 5px;}
    </style>
</head>
<body>
    <header>
        <div id="header">
            <div class="container">
                <div class="row">
                    <div class="col-md-3">
                        <div class="header-logo">
                            <a href="/" class="logo">
                                <img src="{% static 'home/img/logo.png' %}" alt="">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="section">
        <div class="container">
            <div class="register-box">
                <h2 class="text-center" style="margin-bottom: 30px;">ĐĂNG KÝ TÀI KHOẢN</h2>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="form-group">
                        <label>{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                        <small class="helptext">{{ field.help_text }}</small>
                        {% endif %}
                    </div>
                    {% endfor %}
                    
                    <button type="submit" class="register-btn">Đăng ký ngay</button>
                </form>
                
                <p class="text-center" style="margin-top: 20px;">
                    Đã có tài khoản? <a href="#" style="color: #D10024;">Đăng nhập tại đây</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
