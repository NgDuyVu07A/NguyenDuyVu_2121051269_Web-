{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="{% static 'home/css/bootstrap.min.css' %}" />
    <link type="text/css" rel="stylesheet" href="{% static 'home/css/style.css' %}" />
    <style>
        .login-box {
            width: 100%; max-width: 400px; margin: 50px auto;
            padding: 30px; border: 1px solid #e4e7ed; background-color: #fff;
        }
        .form-control { margin-bottom: 15px; height: 40px; }
        .login-btn {
            background-color: #D10024; color: #fff; border: none; 
            width: 100%; height: 40px; font-weight: 700; text-transform: uppercase;
        }
        .login-btn:hover { background-color: #a8001d; }
    </style>
</head>
<body>
    <header>
        <div id="header">
            <div class="container">
                <div class="col-md-3"><div class="header-logo"><a href="/" class="logo"><img src="{% static 'home/img/logo.png' %}" alt=""></a></div></div>
            </div>
        </div>
    </header>

    <div class="section">
        <div class="container">
            <div class="login-box">
                <h3 class="text-center" style="margin-bottom: 20px;">ĐĂNG NHẬP</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Tên đăng nhập</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    
                    <button type="submit" class="login-btn">Đăng nhập</button>
                </form>
                
                <p class="text-center" style="margin-top: 15px;">
                    Chưa có tài khoản? <a href="{% url 'register' %}" style="color: #D10024;">Đăng ký ngay</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
